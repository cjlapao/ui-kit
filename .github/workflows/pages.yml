# .github/workflows/pages.yml
# Publishes the React + Vue playgrounds to GitHub Pages:
#   /ui-kit/          landing page (site-landing/index.html)
#   /ui-kit/react/    react/demo build
#   /ui-kit/vue/      vue/demo build
# Design: docs/superpowers/specs/2026-11-26-github-pages-playground-design.md
# Runs hosted (like publish.yml) — the Pages deploy actions expect GitHub-hosted
# runners; the self-hosted twins stay on release/tag only.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets Pages source to "GitHub Actions" on first run; after that, deploys
# happen via the deploy-pages action below. Requires the `github-pages`
# environment (auto-created by GitHub when Pages is set to Actions source —
# see the gh api command in the design doc for one-time enablement).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: react/package-lock.json

      # Root devDependencies (date-fns, crypto-js) satisfy bare imports in
      # common/ sources that the demos' resolver plugin walks up to reach.
      - name: Install (root)
        run: npm ci

      # The demos alias the kit *source* (../src) via file:.. deps + vite
      # aliases, so the package dirs need installing too, not just the demos.
      - name: Install (react package + demo)
        run: |
          npm ci
          npm ci --prefix demo
        working-directory: react

      - name: Install (vue package + demo)
        run: |
          npm ci
          npm ci --prefix demo
        working-directory: vue

      # The react demo's index.css @imports the built package css
      # (../../dist/index.css), so each package must be built before its demo.
      - name: Build (react package)
        run: npm --prefix react run build

      - name: Build (vue package)
        run: npm --prefix vue run build

      # --base is CI-only: the vite configs stay untouched so `npm run dev`
      # keeps serving the demos at / locally.
      - name: Build (react demo)
        run: npm --prefix react/demo run build -- --base=/ui-kit/react/

      - name: Build (vue demo)
        run: npm --prefix vue/demo run build -- --base=/ui-kit/vue/

      - name: Assemble site
        run: node scripts/assemble-pages-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
