# Intentional kill switches on the release chain — see
# docs/superpowers/specs/2026-11-26-self-hosted-pipelines-design.md
# (release/tag run self-hosted with the hosted files disabled; publish runs
# hosted with the self-hosted twin disabled).
paths:
  .github/workflows/release.yml:
    ignore:
      - 'constant expression "false" in condition'
  .github/workflows/tag.yml:
    ignore:
      - 'constant expression "false" in condition'
  .github/workflows/publish-selfhost.yml:
    ignore:
      - 'constant expression "false" in condition'
